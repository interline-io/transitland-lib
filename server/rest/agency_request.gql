fragment alert on Alert {
  entity_id
  rt_feed_onestop_id
  cause
  effect
  severity_level
  url {
    language
    text
  }
  header_text {
    language
    text
  }
  description_text {
    language
    text
  }
  tts_header_text {
    language
    text
  }
  tts_description_text {
    language
    text
  }
  active_period {
    start
    end
  }
  informed_entity {
    agency_id
    route_id
    route_type
    direction_id
    stop_id
    trip {
      trip_id
      route_id
      direction_id
      start_time
      start_date
      schedule_relationship
    }
  }
}

query ($limit: Int, $ids: [Int!], $after: Int, $include_alerts: Boolean!, $include_routes: Boolean!, $where: AgencyFilter) {
  agencies(limit: $limit, after: $after, ids: $ids, where: $where) {
    id
    agency_name
    agency_id
    onestop_id
    agency_url
    agency_timezone
    agency_lang
    agency_phone
    agency_fare_url
    agency_email
    cemv_support
    geometry
    route_types
    route_types_basic
    operator {
      onestop_id
      name
      short_name
      tags
      feeds {
        id
        onestop_id
        name
        spec
      }
    }
    alerts(include_modes: true) @include(if: $include_alerts) {
      ...alert
    }
    places(where: {min_rank: 0.2}) {
      city_name
      adm0_name
      adm1_name
    }
    feed_version {
      id
      sha1
      fetched_at
      feed {
        id
        onestop_id
      }
    }
    routes(limit: 1000) @include(if: $include_routes) {
      id
      route_id
      route_short_name
      route_long_name
      alerts @include(if: $include_alerts) {
        ...alert
      }
    }
  }
}
