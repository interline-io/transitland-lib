fragment alert on Alert {
  cause
  effect
  severity_level
  url {
    language
    text
  }
  header_text {
    language
    text
  }
  description_text {
    language
    text
  }
  tts_header_text {
    language
    text
  }
  tts_description_text {
    language
    text
  }
  active_period {
    start
    end
  }
  informed_entity {
    agency_id
    route_id
    route_type
    direction_id
    stop_id
    trip {
      trip_id
      route_id
      direction_id
      start_time
      start_date
      schedule_relationship
    }
  }
}

query ($limit: Int, $after: Int, $include_alerts: Boolean!, $where: OperatorFilter) {
  operators(after: $after, limit: $limit, where: $where) {
    id
    onestop_id
    name
    short_name
    website
    tags
    feeds {
      id
      onestop_id
      name
      spec
    }
    agencies {
      id
      agency_id
      agency_name
      geometry
      route_types
      route_types_basic
      alerts(include_modes: true) @include(if: $include_alerts) {
        ...alert
      }
      places(where: {min_rank: 0.2}) {
        city_name
        adm0_name
        adm1_name
      }
    }
  }
}
